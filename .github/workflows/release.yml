name: Release

# Triggered by a version tag, deliberately. A release is a decision, not
# something that happens because somebody merged — and the tag is what the
# updater's version comparison is ultimately against.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The tag and the four in-repo versions must agree. Without this a build
      # tagged v0.3.0 could ship an installer that calls itself 0.2.0, and every
      # install would be offered the "update" forever.
      - name: Check the tag matches the app version
        shell: bash
        run: |
          node scripts/check-versions.mjs
          TAG="${GITHUB_REF_NAME#v}"
          APP=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$APP" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $APP"
            exit 1
          fi

      - name: Type check
        run: npx tsc --noEmit

      - name: Enforce data-only public asset boundary
        run: |
          npm run scan:modpacks
          npm run scan:public-assets

      - name: Rights publisher tooling tests
        run: npm run test:rights-tooling

      - name: Frontend tests
        run: npx vitest run

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Builds the NSIS installer, which under `createUpdaterArtifacts: true` is
      # itself the updater artifact — there is no separate `.nsis.zip` — and
      # generates its detached `.sig`. `latest.json` is then written by this
      # action from that same signature, so the manifest and the file it
      # describes can never disagree.
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_FEEDBACK_API_URL: ${{ vars.VITE_FEEDBACK_API_URL }}
          # The private half of the updater key pair. Held only here and in
          # whatever the maintainer keeps passwords in — never in the repository.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DinoDepot Studio ${{ github.ref_name }}
          releaseBody: |
            Windows 10/11 x64.

            Existing installs will be offered this update automatically.
          # Published as a draft so somebody looks at it before every install in
          # the world is offered it. Publishing the draft is what makes it live.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true

  # Fails loudly rather than silently shipping an unsigned build that no
  # existing install would accept.
  verify-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the signing key is configured
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set. See docs/release.md."
            exit 1
          fi
          echo "Signing key is configured."
